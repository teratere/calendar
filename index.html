<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマートカレンダー - Smart Calendar</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* スクロールバーのカスタマイズ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.7);
    }
  </style>
</head>
<!-- 背景色を落ち着いたグレー系にしてカレンダー本体の白と明確に差別化 -->
<body class="bg-slate-200/60 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white transition-colors duration-200">

  <!-- ヘッダーバー -->
  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b-2 border-slate-300 dark:border-slate-800 sticky top-0 z-30 px-4 py-3 sm:px-6 shadow-xs">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- ロゴ & 年月表示 -->
      <div class="flex items-center space-x-3 sm:space-x-5">
        <div class="flex items-center space-x-2 text-brand-600 dark:text-brand-400 font-bold text-xl tracking-tight">
          <div class="p-2 bg-brand-50 dark:bg-brand-950 rounded-xl text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-900">
            <i data-lucide="calendar" class="w-5 h-5"></i>
          </div>
          <span class="hidden sm:inline font-extrabold">カレンダー</span>
        </div>

        <!-- ナビゲーションボタン群 -->
        <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-300 dark:border-slate-700">
          <button id="prevBtn" class="p-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition shadow-none hover:shadow-xs active:scale-95" title="前の月へ">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <button id="todayBtn" class="px-3 py-1 text-xs font-bold rounded-lg bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:text-brand-600 dark:hover:text-brand-400 transition shadow-xs active:scale-95">
            今日
          </button>
          <button id="nextBtn" class="p-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition shadow-none hover:shadow-xs active:scale-95" title="次の月へ">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>

        <h1 id="currentDateLabel" class="text-lg sm:text-2xl font-black tracking-tight text-slate-900 dark:text-white select-none min-w-[130px]">
          2026年 10月
        </h1>
        <!-- API同期ステータス表示バッジ -->
        <div id="apiSyncStatus" class="hidden sm:inline-flex items-center gap-1.5 text-[11px] text-emerald-700 dark:text-emerald-300 font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-300 dark:border-emerald-800" title="祝日データ状態">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>祝日ハイブリッド同期</span>
        </div>
      </div>

      <!-- 右側アクションコントロール -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 表示モード切り替え -->
        <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs sm:text-sm font-semibold border border-slate-300 dark:border-slate-700">
          <button data-view="month" class="view-btn px-3 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400">月</button>
          <button data-view="week" class="view-btn px-3 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400">週</button>
          <button data-view="day" class="view-btn px-3 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400">日</button>
        </div>

        <!-- テーマ切り替えボタン -->
        <button id="themeToggleBtn" class="p-2 text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white rounded-xl bg-white dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-700 shadow-xs hover:bg-slate-50 active:scale-95 transition" title="ダークモード切り替え">
          <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
          <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 md:p-6 flex flex-col">
    <!-- カレンダー本体カード：外周枠線 border-2 border-slate-300 を持たせて背景からくっきり独立 -->
    <div id="calendarViewContainer" class="flex-1 bg-white dark:bg-slate-900 rounded-2xl border-2 border-slate-300 dark:border-slate-800 shadow-md overflow-hidden flex flex-col min-h-[600px]">
      <!-- 動的に月/週/日ビューが挿入されます -->
    </div>
  </main>

  <!-- アプリケーションロジック -->
  <script>
    // --- 祝日ハイブリッド管理 (自動計算 + API同期 + ローカルキャッシュ) ---
    const API_CACHE_KEY_PREFIX = 'smart_cal_holidays_api_';

    function getNthMonday(year, month, n) {
      const firstDay = new Date(year, month - 1, 1);
      const firstDayOfWeek = firstDay.getDay();
      const offset = (firstDayOfWeek <= 1 ? 1 - firstDayOfWeek : 8 - firstDayOfWeek);
      return 1 + offset + (n - 1) * 7;
    }

    function getVernalEquinoxDay(year) {
      if (year < 1980 || year > 2099) return 20;
      return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function getAutumnalEquinoxDay(year) {
      if (year < 1980 || year > 2099) return 23;
      return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function calculateHolidaysForYear(year) {
      const holidays = {};

      holidays[`${year}-01-01`] = '元日';
      holidays[`${year}-01-${String(getNthMonday(year, 1, 2)).padStart(2, '0')}`] = '成人の日';
      holidays[`${year}-02-11`] = '建国記念の日';
      if (year >= 2020) {
        holidays[`${year}-02-23`] = '天皇誕生日';
      }
      holidays[`${year}-03-${String(getVernalEquinoxDay(year)).padStart(2, '0')}`] = '春分の日';
      holidays[`${year}-04-29`] = '昭和の日';
      holidays[`${year}-05-03`] = '憲法記念日';
      holidays[`${year}-05-04`] = 'みどりの日';
      holidays[`${year}-05-05`] = 'こどもの日';

      holidays[`${year}-07-${String(getNthMonday(year, 7, 3)).padStart(2, '0')}`] = '海の日';
      if (year >= 2016) {
        holidays[`${year}-08-11`] = '山の日';
      }

      const respectElderDay = getNthMonday(year, 9, 3);
      const autumnEquinoxDay = getAutumnalEquinoxDay(year);
      holidays[`${year}-09-${String(respectElderDay).padStart(2, '0')}`] = '敬老の日';
      holidays[`${year}-09-${String(autumnEquinoxDay).padStart(2, '0')}`] = '秋分の日';

      if (autumnEquinoxDay - respectElderDay === 2) {
        holidays[`${year}-09-${String(respectElderDay + 1).padStart(2, '0')}`] = '国民の休日';
      }

      holidays[`${year}-10-${String(getNthMonday(year, 10, 2)).padStart(2, '0')}`] = 'スポーツの日';
      holidays[`${year}-11-03`] = '文化の日';
      holidays[`${year}-11-23`] = '勤労感謝の日';

      // 振替休日判定
      const sortedDates = Object.keys(holidays).sort();
      sortedDates.forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        if (d.getDay() === 0) {
          let substitute = new Date(d);
          while (true) {
            substitute.setDate(substitute.getDate() + 1);
            const subStr = formatDateYMD(substitute);
            if (!holidays[subStr]) {
              holidays[subStr] = '振替休日';
              break;
            }
          }
        }
      });

      return holidays;
    }

    const memoryHolidayCache = {};

    function getHolidaysForYear(year) {
      if (memoryHolidayCache[year]) {
        return memoryHolidayCache[year];
      }

      const cached = localStorage.getItem(API_CACHE_KEY_PREFIX + year);
      if (cached) {
        try {
          memoryHolidayCache[year] = JSON.parse(cached);
          return memoryHolidayCache[year];
        } catch (e) {}
      }

      memoryHolidayCache[year] = calculateHolidaysForYear(year);
      fetchHolidaysFromAPI(year);
      return memoryHolidayCache[year];
    }

    const fetchingYears = new Set();
    async function fetchHolidaysFromAPI(year) {
      if (fetchingYears.has(year)) return;
      fetchingYears.add(year);

      try {
        const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
        if (!res.ok) throw new Error('API request failed');
        const apiData = await res.json();

        if (apiData && typeof apiData === 'object' && Object.keys(apiData).length > 0) {
          memoryHolidayCache[year] = {
            ...calculateHolidaysForYear(year),
            ...apiData
          };
          localStorage.setItem(API_CACHE_KEY_PREFIX + year, JSON.stringify(memoryHolidayCache[year]));

          if (state.currentDate.getFullYear() === year) {
            render();
          }
        }
      } catch (err) {
      } finally {
        fetchingYears.delete(year);
      }
    }

    function getHolidayName(date) {
      const year = date.getFullYear();
      const holidays = getHolidaysForYear(year);
      return holidays[formatDateYMD(date)] || null;
    }

    const ROKUYO_LIST = ['大安', '赤口', '先勝', '友引', '先負', '仏滅'];

    // --- State 管理 ---
    const state = {
      currentDate: new Date(),
      view: 'month'
    };

    const THEME_KEY = 'smart_calendar_theme';

    function formatDateYMD(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isSameDay(d1, d2) {
      return (
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate()
      );
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    }

    function updateDateLabel() {
      const d = state.currentDate;
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const label = document.getElementById('currentDateLabel');

      if (state.view === 'month') {
        label.textContent = `${y}年 ${m}月`;
      } else if (state.view === 'week') {
        const start = getWeekStart(d);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        if (start.getMonth() === end.getMonth()) {
          label.textContent = `${y}年 ${m}月 第${Math.ceil(d.getDate() / 7)}週`;
        } else {
          label.textContent = `${start.getMonth() + 1}月〜${end.getMonth() + 1}月`;
        }
      } else if (state.view === 'day') {
        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
        label.textContent = `${y}年 ${m}月 ${d.getDate()}日 (${dayNames[d.getDay()]})`;
      }
    }

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diffToMonday = (day + 6) % 7;
      d.setDate(d.getDate() - diffToMonday);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function render() {
      updateDateLabel();
      updateViewButtons();

      const container = document.getElementById('calendarViewContainer');
      container.innerHTML = '';

      if (state.view === 'month') {
        renderMonthView(container);
      } else if (state.view === 'week') {
        renderWeekView(container);
      } else if (state.view === 'day') {
        renderDayView(container);
      }

      lucide.createIcons();
    }

    function updateViewButtons() {
      document.querySelectorAll('.view-btn').forEach(btn => {
        if (btn.dataset.view === state.view) {
          btn.className = 'view-btn px-3 py-1.5 rounded-lg transition bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 font-bold shadow-xs';
        } else {
          btn.className = 'view-btn px-3 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200';
        }
      });
    }

    // ==========================================
    // 1. 月ビュー (Month View) - くっきり枠線と視認性重視
    // ==========================================
    function renderMonthView(container) {
      const y = state.currentDate.getFullYear();
      const m = state.currentDate.getMonth();
      const firstDay = new Date(y, m, 1);
      const startDayIndex = (firstDay.getDay() + 6) % 7;
      const lastDate = new Date(y, m + 1, 0).getDate();
      const prevMonthLastDate = new Date(y, m, 0).getDate();

      const totalCellsNeeded = startDayIndex + lastDate;
      const totalCells = Math.ceil(totalCellsNeeded / 7) * 7;

      const today = new Date();
      const dayHeaders = [
        { label: '月', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '火', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '水', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '木', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '金', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '土', colorClass: 'text-blue-700 dark:text-blue-300 bg-blue-100/90 dark:bg-blue-950/70 font-black' },
        { label: '日', colorClass: 'text-rose-700 dark:text-rose-300 bg-rose-100/90 dark:bg-rose-950/70 font-black' }
      ];

      // 曜日ヘッダー
      let html = `
        <div class="grid grid-cols-7 border-b-2 border-slate-300 dark:border-slate-700 text-center text-xs sm:text-sm font-bold select-none divide-x divide-slate-300 dark:divide-slate-700">
          ${dayHeaders.map(h => `
            <div class="py-2.5 ${h.colorClass}">${h.label}</div>
          `).join('')}
        </div>
        <!-- グリッドの格子線：bg-slate-300 と gap-[1px] でくっきりと可視化 -->
        <div class="grid grid-cols-7 flex-1 auto-rows-fr select-none bg-slate-300 dark:bg-slate-700 gap-[1px]">
      `;

      let dayCounter = 1;
      let nextMonthDayCounter = 1;

      for (let i = 0; i < totalCells; i++) {
        let cellDate;
        let isCurrentMonth = false;

        if (i < startDayIndex) {
          const pDay = prevMonthLastDate - (startDayIndex - 1 - i);
          cellDate = new Date(y, m - 1, pDay);
        } else if (dayCounter <= lastDate) {
          cellDate = new Date(y, m, dayCounter);
          dayCounter++;
          isCurrentMonth = true;
        } else {
          cellDate = new Date(y, m + 1, nextMonthDayCounter);
          nextMonthDayCounter++;
        }

        const dateStr = formatDateYMD(cellDate);
        const holiday = getHolidayName(cellDate);
        const isToday = isSameDay(cellDate, today);
        const dayOfWeek = cellDate.getDay();

        let cellBgClass = 'bg-white dark:bg-slate-900';
        let dateTextColor = 'text-slate-800 dark:text-slate-200 font-semibold';

        if (dayOfWeek === 6) {
          // 土曜日
          cellBgClass = isCurrentMonth 
            ? 'bg-blue-100/50 dark:bg-blue-950/40' 
            : 'bg-blue-100/20 dark:bg-blue-950/20 opacity-50';
          dateTextColor = 'text-blue-700 dark:text-blue-300 font-black';
        } else if (dayOfWeek === 0 || holiday) {
          // 日曜 または 祝日
          cellBgClass = isCurrentMonth 
            ? 'bg-rose-100/50 dark:bg-rose-950/40' 
            : 'bg-rose-100/20 dark:bg-rose-950/20 opacity-50';
          dateTextColor = 'text-rose-700 dark:text-rose-300 font-black';
        } else if (!isCurrentMonth) {
          cellBgClass = 'bg-slate-100/70 dark:bg-slate-950/60 opacity-40';
          dateTextColor = 'text-slate-400 dark:text-slate-600 font-medium';
        }

        html += `
          <div data-date="${dateStr}" class="calendar-cell min-h-[90px] sm:min-h-[110px] p-1.5 sm:p-2 transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/80 flex flex-col cursor-pointer ${cellBgClass}">
            <div class="flex items-center justify-between">
              <span class="inline-flex items-center justify-center w-7 h-7 text-xs sm:text-sm rounded-full ${
                isToday
                  ? 'bg-brand-600 text-white font-extrabold shadow-sm ring-2 ring-brand-300 dark:ring-brand-900'
                  : dateTextColor
              }">
                ${cellDate.getDate()}
              </span>
              ${holiday ? `<span class="text-[10px] text-rose-700 dark:text-rose-300 font-extrabold truncate max-w-[85px] bg-rose-200/80 dark:bg-rose-950 px-1.5 py-0.5 rounded border border-rose-300 dark:border-rose-900">${holiday}</span>` : ''}
            </div>
            
            <div class="mt-auto pt-2 flex justify-end">
              <span class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">
                ${ROKUYO_LIST[(cellDate.getDate() + cellDate.getMonth()) % 6]}
              </span>
            </div>
          </div>
        `;
      }

      html += `</div>`;
      container.innerHTML = html;

      container.querySelectorAll('.calendar-cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const [yy, mm, dd] = cell.dataset.date.split('-').map(Number);
          state.currentDate = new Date(yy, mm - 1, dd);
          state.view = 'day';
          render();
        });
      });
    }

    // ==========================================
    // 2. 週ビュー (Week View)
    // ==========================================
    function renderWeekView(container) {
      const weekStart = getWeekStart(state.currentDate);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        days.push(d);
      }

      const today = new Date();
      const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];

      let html = `
        <div class="flex flex-col flex-1 divide-y-2 divide-slate-200 dark:divide-slate-800 overflow-y-auto">
          ${days.map(d => {
            const isToday = isSameDay(d, today);
            const dateStr = formatDateYMD(d);
            const holiday = getHolidayName(d);
            const rokuyo = ROKUYO_LIST[(d.getDate() + d.getMonth()) % 6];
            const dayOfWeek = d.getDay();

            let rowBgClass = 'bg-white dark:bg-slate-900';
            let badgeClass = 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700';
            let nameTextColor = 'text-slate-800 dark:text-slate-200 font-bold';

            if (isToday) {
              rowBgClass = 'bg-brand-50/40 dark:bg-brand-950/20';
              badgeClass = 'bg-brand-600 text-white shadow-sm border border-brand-700';
            } else if (dayOfWeek === 6) {
              rowBgClass = 'bg-blue-100/40 dark:bg-blue-950/30';
              badgeClass = 'bg-blue-200 dark:bg-blue-950 text-blue-800 dark:text-blue-200 font-black border border-blue-400 dark:border-blue-800';
              nameTextColor = 'text-blue-700 dark:text-blue-300 font-black';
            } else if (dayOfWeek === 0 || holiday) {
              rowBgClass = 'bg-rose-100/40 dark:bg-rose-950/30';
              badgeClass = 'bg-rose-200 dark:bg-rose-950 text-rose-800 dark:text-rose-200 font-black border border-rose-400 dark:border-rose-800';
              nameTextColor = 'text-rose-700 dark:text-rose-300 font-black';
            }

            return `
              <div data-date="${dateStr}" class="week-row p-4 sm:p-5 flex items-center justify-between hover:bg-slate-100/60 dark:hover:bg-slate-800/60 transition-colors cursor-pointer ${rowBgClass}">
                <div class="flex items-center space-x-4">
                  <div class="w-12 h-12 rounded-xl flex flex-col items-center justify-center font-bold shadow-xs ${badgeClass}">
                    <span class="text-[10px] uppercase tracking-wider leading-none opacity-80">${d.getMonth() + 1}月</span>
                    <span class="text-lg leading-tight mt-0.5">${d.getDate()}</span>
                  </div>
                  <div>
                    <div class="flex items-center space-x-2">
                      <span class="text-sm sm:text-base ${nameTextColor}">${dayNames[dayOfWeek]}</span>
                      ${holiday ? `<span class="text-xs px-2 py-0.5 rounded bg-rose-200 border border-rose-400 dark:bg-rose-950 text-rose-800 dark:text-rose-200 font-black">${holiday}</span>` : ''}
                      ${isToday ? `<span class="text-xs px-2 py-0.5 rounded bg-brand-600 text-white font-bold">今日</span>` : ''}
                    </div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-medium">
                      六曜: ${rokuyo}
                    </div>
                  </div>
                </div>
                <div class="text-slate-400 dark:text-slate-600">
                  <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      container.innerHTML = html;

      container.querySelectorAll('.week-row').forEach(row => {
        row.addEventListener('click', () => {
          const [yy, mm, dd] = row.dataset.date.split('-').map(Number);
          state.currentDate = new Date(yy, mm - 1, dd);
          state.view = 'day';
          render();
        });
      });
    }

    // ==========================================
    // 3. 日ビュー (Day View)
    // ==========================================
    function renderDayView(container) {
      const d = state.currentDate;
      const dateStr = formatDateYMD(d);
      const holiday = getHolidayName(d);
      const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
      const dayOfWeek = d.getDay();
      const isToday = isSameDay(d, new Date());
      const rokuyo = ROKUYO_LIST[(d.getDate() + d.getMonth()) % 6];

      const startOfYear = new Date(d.getFullYear(), 0, 1);
      const dayOfYear = Math.floor((d - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
      const totalDays = ((d.getFullYear() % 4 === 0 && d.getFullYear() % 100 !== 0) || d.getFullYear() % 400 === 0) ? 366 : 365;
      const yearProgress = Math.round((dayOfYear / totalDays) * 100);

      let dayAccentClass = 'text-slate-900 dark:text-white';
      let dayCardBorder = 'border-2 border-slate-300 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-800/50';

      if (isToday) {
        dayAccentClass = 'text-brand-600 dark:text-brand-400';
        dayCardBorder = 'border-2 border-brand-300 dark:border-brand-900/60 bg-brand-50/30 dark:bg-brand-950/20';
      } else if (dayOfWeek === 6) {
        dayAccentClass = 'text-blue-700 dark:text-blue-400';
        dayCardBorder = 'border-2 border-blue-300 dark:border-blue-900/60 bg-blue-50/30 dark:bg-blue-950/20';
      } else if (dayOfWeek === 0 || holiday) {
        dayAccentClass = 'text-rose-700 dark:text-rose-400';
        dayCardBorder = 'border-2 border-rose-300 dark:border-rose-900/60 bg-rose-50/30 dark:bg-rose-950/20';
      }

      let html = `
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
          <div class="max-w-md w-full rounded-2xl p-8 border ${dayCardBorder} shadow-xs flex flex-col items-center relative overflow-hidden">
            
            <span class="text-xs font-bold tracking-widest text-slate-500 uppercase bg-white dark:bg-slate-800 px-3 py-1 rounded-full border border-slate-300 dark:border-slate-700 mb-2">
              ${d.getFullYear()}年
            </span>
            
            <div class="text-7xl sm:text-8xl font-black tracking-tight my-2 ${dayAccentClass}">
              ${d.getDate()}
            </div>

            <div class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
              <span>${d.getMonth() + 1}月</span>
              <span>・</span>
              <span class="${dayOfWeek === 0 || holiday ? 'text-rose-700 font-extrabold' : dayOfWeek === 6 ? 'text-blue-700 font-extrabold' : ''}">${dayNames[dayOfWeek]}</span>
            </div>

            ${holiday ? `
              <div class="mt-3 px-3 py-1 rounded-full bg-rose-200 dark:bg-rose-950 text-rose-800 dark:text-rose-200 text-xs font-black border border-rose-400 dark:border-rose-800">
                祝日: ${holiday}
              </div>
            ` : ''}

            <!-- 詳細情報カード -->
            <div class="w-full grid grid-cols-2 gap-3 mt-6 pt-6 border-t-2 border-slate-300 dark:border-slate-700 text-left">
              <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-300 dark:border-slate-700">
                <span class="text-xs text-slate-500 dark:text-slate-400 block font-bold">六曜</span>
                <span class="text-sm font-black text-slate-800 dark:text-slate-200">${rokuyo}</span>
              </div>
              <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-300 dark:border-slate-700">
                <span class="text-xs text-slate-500 dark:text-slate-400 block font-bold">通日 / 進捗</span>
                <span class="text-sm font-black text-slate-800 dark:text-slate-200">${dayOfYear}日目 (${yearProgress}%)</span>
              </div>
            </div>

            <button id="backToMonthBtn" class="mt-6 text-xs text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 flex items-center gap-1 font-bold bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 shadow-2xs active:scale-95 transition">
              <i data-lucide="calendar" class="w-4 h-4"></i>
              月表示に戻る
            </button>
          </div>
        </div>
      `;

      container.innerHTML = html;

      const backBtn = container.querySelector('#backToMonthBtn');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          state.view = 'month';
          render();
        });
      }
    }

    // --- ナビゲーション処理 ---
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (state.view === 'month') {
        state.currentDate.setMonth(state.currentDate.getMonth() - 1);
      } else if (state.view === 'week') {
        state.currentDate.setDate(state.currentDate.getDate() - 7);
      } else if (state.view === 'day') {
        state.currentDate.setDate(state.currentDate.getDate() - 1);
      }
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (state.view === 'month') {
        state.currentDate.setMonth(state.currentDate.getMonth() + 1);
      } else if (state.view === 'week') {
        state.currentDate.setDate(state.currentDate.getDate() + 7);
      } else if (state.view === 'day') {
        state.currentDate.setDate(state.currentDate.getDate() + 1);
      }
      render();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      state.currentDate = new Date();
      render();
    });

    // 表示切り替え
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.view = btn.dataset.view;
        render();
      });
    });

    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

    // --- 初期起動処理 ---
    window.onload = function() {
      initTheme();
      render();
    };
  </script>
</body>
</html>
